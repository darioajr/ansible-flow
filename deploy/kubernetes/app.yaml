apiVersion: v1
kind: ServiceAccount
metadata:
  name: playbook-flow
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: playbook-flow
data:
  DATA_DIR: /data
  NEXT_TELEMETRY_DISABLED: "1"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: playbook-flow-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playbook-flow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: playbook-flow
  template:
    metadata:
      labels:
        app: playbook-flow
    spec:
      serviceAccountName: playbook-flow
      securityContext:
        runAsNonRoot: true
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: playbook-flow:0.2.0
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: playbook-flow
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: playbook-flow-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: playbook-flow
spec:
  selector:
    app: playbook-flow
  ports:
    - name: http
      port: 80
      targetPort: http
