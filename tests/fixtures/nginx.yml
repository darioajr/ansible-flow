# Portable nginx configuration
- name: Configure nginx
  hosts: webservers
  become: true
  gather_facts: true
  vars:
    http_port: 80
  tasks:
    # Package installation
    - name: Install nginx
      ansible.builtin.dnf:
        name: nginx
        state: present
      register: nginx_package
      when: ansible_facts.os_family == "RedHat"
    - name: Deploy configuration
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        mode: "0644"
      notify:
        - Restart nginx
    - name: Start nginx
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started
  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
