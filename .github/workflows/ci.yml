name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/prepare-marketplace-release.test.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pipx install ansible-core
      - run: RUN_ANSIBLE_SYNTAX=1 pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: xvfb-run -a node scripts/test-extension.mjs
      - run: pnpm --filter visual-ansible-extension package
      - run: docker build -t playbook-flow:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: playbook-flow:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: apps/vscode/extension/*.vsix
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
